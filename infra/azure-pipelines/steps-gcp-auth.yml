# GCP 認證分派樣板 —— 依 `method` 參數選一條路徑，呼叫端不用管細節。
#
#   wif     ：Workload Identity Federation，無長期金鑰（預設，建議）
#   sa-key  ：服務帳號長期 JSON 金鑰（備援）
#
# 兩條路徑的前置設定、所需 IAM 角色與踩雷點見 docs/azure-devops-setup.md。

parameters:
  - name: method
    type: string
    default: wif
    values:
      - wif
      - sa-key

steps:
  - ${{ if eq(parameters.method, 'wif') }}:
      - template: steps-gcp-auth-wif.yml
  - ${{ if eq(parameters.method, 'sa-key') }}:
      - template: steps-gcp-auth-sakey.yml
