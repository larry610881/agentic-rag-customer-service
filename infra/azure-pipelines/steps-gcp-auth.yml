# GCP 認證步驟樣板 — 由 azure-pipelines.yml 各 stage 重複使用。
#
# 憑證來源：變數群組 `agentic-rag-gcp` 的祕密變數 GCP_SA_KEY（服務帳號 JSON 全文）。
# 寫進 agent 的暫存目錄後立即 gcloud auth activate-service-account，
# 檔案隨 agent 工作目錄在作業結束時清除；不落到 repo、不進 log。
#
# 想改用 Workload Identity Federation（不放長期金鑰）時，把下面 script 換成
# gcloud iam workload-identity-pools create-cred-config + Azure OIDC token 即可，
# 其餘 stage 不用動。設定步驟見 docs/azure-devops-setup.md。

steps:
  - task: DownloadSecureFile@1
    name: gcpKey
    displayName: 取得 GCP 服務帳號金鑰
    inputs:
      secureFile: gcp-sa-key.json

  - script: |
      set -euo pipefail
      gcloud auth activate-service-account --key-file="$(gcpKey.secureFilePath)"
      gcloud config set project "$(GCP_PROJECT_ID)"
      gcloud config set compute/region "$(GCP_REGION)"
      echo "已以 $(gcloud config get-value account) 登入"
    displayName: gcloud 認證
