# GCP 認證 —— Workload Identity Federation（無長期金鑰，預設路徑）
#
# 流程：Azure DevOps 對「這條管線本身」簽發短效 OIDC token（不需要任何服務連線）
#   iss = https://vstoken.dev.azure.com/<Azure DevOps 組織 GUID>
#   sub = p://<組織>/<專案>/<管線名稱>
#   aud = api://AzureADTokenExchange
#   另有 prj_id（專案 GUID）、def_id（管線定義 id）、rpo_ref（分支）等 claim
# → GCP 的 workload identity pool provider 信任該 issuer，並以 prj_id + def_id 綁定
#   部署用服務帳號 → STS 換成短效存取權杖。整段沒有任何長期祕密。
#
# 為什麼不用服務連線：2025-11 起 Azure Resource Manager 服務連線改由 Entra 簽發 token
# （issuer 變成 login.microsoftonline.com/<tenant>），沒有真實 Azure 租戶就換不到；而且
# 對服務連線請 token 必須有 task 明確引用它，純 script 步驟拿不到。管線層級的 token
# 兩個問題都沒有（2026-09-22 以 infra/azure-pipelines/probe-oidc-claims.yml 實測）。
#
# 需要的變數（放 `agentic-rag-gcp-<environment>` 變數群組）：
#   GCP_WIF_PROVIDER   GCP 端 provider 的完整資源路徑，infra 建好後給你：
#                      projects/<專案編號>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOY_SA      部署用服務帳號 email（infra 給）
#
# 注意：OIDC token 只有約 10 分鐘效期。gcloud 換到的存取權杖有 1 小時，
# 但存取權杖過期後 gcloud 會回頭重讀 token 檔，此時 OIDC token 早已失效。
# 因此本樣板要「緊接在實際使用 gcloud 的步驟之前」引用，不要放在 job 開頭
# 然後隔一段長時間才用。

steps:
  - script: |
      set -euo pipefail
      RESP=$(curl -sS -X POST \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        -H "Content-Type: application/json" \
        -H "Content-Length: 0" \
        "$(System.OidcRequestUri)?api-version=7.1")
      TOKEN=$(printf '%s' "$RESP" | jq -r '.oidcToken // empty')
      if [ -z "$TOKEN" ]; then
        # 不要印 $RESP 全文，錯誤回應可能夾帶其他權杖
        echo "##vso[task.logissue type=error]取不到 OIDC token（HTTP 回應無 oidcToken 欄位）"
        echo "檢查：專案是否為 Private（Public 專案不發 OIDC token）、System.AccessToken 是否可用"
        exit 1
      fi
      umask 077
      printf '%s' "$TOKEN" > "$(Agent.TempDirectory)/gcp-oidc-token.txt"
      # 只印非機密 claim，方便對照 GCP provider 的 issuer / attribute condition
      printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l) $0=$0 substr("===",1,4-l); print }' \
        | base64 -d 2>/dev/null | jq -c '{iss, sub, aud, prj_id, def_id, rpo_ref}' || true
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: 取得 Azure DevOps OIDC token（管線層級，不經服務連線）

  - script: |
      set -euo pipefail
      gcloud iam workload-identity-pools create-cred-config \
        "$(GCP_WIF_PROVIDER)" \
        --service-account="$(GCP_DEPLOY_SA)" \
        --credential-source-file="$(Agent.TempDirectory)/gcp-oidc-token.txt" \
        --output-file="$(Agent.TempDirectory)/gcp-cred-config.json"
      gcloud auth login --cred-file="$(Agent.TempDirectory)/gcp-cred-config.json"
      gcloud config set project "$(GCP_PROJECT_ID)"
      gcloud config set compute/region "$(GCP_REGION)"
      echo "已以 $(gcloud config get-value account) 登入（WIF）"
    displayName: gcloud 認證（Workload Identity Federation）
