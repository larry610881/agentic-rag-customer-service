# =============================================================================
# Agentic RAG Customer Service — Azure DevOps 多階段管線
#
#   CI（每個 PR / push）→ Package（只有 main）→ Release（自動部署，無人工閘門）
#
# 前置設定見 docs/azure-devops-setup.md：
#   - GCP 認證預設走 Workload Identity Federation（無長期金鑰、不需要 Azure 服務連線，
#     用管線本身的 OIDC token）；要退回服務帳號金鑰時，手動觸發時把參數 gcpAuthMethod
#     改成 sa-key，或改下面的 default
#   - 變數群組 `agentic-rag-gcp-<environment>`（一個環境一組，見 docs/azure-devops-setup.md §4）
#   - Environment `poc`（只留部署歷史；**不要加 approvals**，加了就變成要人核准）
# =============================================================================

parameters:
  - name: environment
    displayName: 部署環境（對應 Library variable group agentic-rag-gcp-<environment> 與 Environment 資源）
    type: string
    default: poc
    values:
      - poc
  - name: coverageFailUnder
    displayName: 單元測試覆蓋率門檻（%）；專案規範 80，首次接管線時可暫以現況 78 排程
    type: number
    default: 80
  - name: gcpAuthMethod
    displayName: GCP 認證方式
    type: string
    default: wif
    values:
      - wif      # Workload Identity Federation（無長期金鑰）
      - sa-key   # 服務帳號 JSON 金鑰（備援）
  - name: mode
    displayName: 模式（deploy＝建置並部署本次 commit；rollback＝把既有映像部署回去，跳過 CI / 建置）
    type: string
    default: deploy
    values:
      - deploy
      - rollback
  - name: rollbackImageTag
    displayName: 回滾目標映像 tag（只在 rollback 用；poc-previous＝上一次 deploy 前的版本，或填 rc-<commit sha>）
    type: string
    default: poc-previous

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - "**/*.md"

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - "**/*.md"

variables:
  # YAML 不含任何環境專屬值：一個環境一組 Library variable group，名稱
  # `agentic-rag-gcp-<environment>`，由 environment 參數切換。GitHub 鏡像是公開 repo，
  # VM 使用者 / 路徑這類識別碼也不放 YAML。憑證在 WIF 流程裡不存在，備援 SA 金鑰走 Secure Files。
  - group: agentic-rag-gcp-${{ parameters.environment }}
  - name: pythonVersion
    value: "3.12"
  - name: nodeVersion
    value: "20.x"
  - name: serviceName
    value: agentic-rag
  - name: arRepo
    value: poc-ar-rag
  - name: imageTag
    value: "rc-$(Build.SourceVersion)"

pool:
  vmImage: ubuntu-latest

# 整合測試 job 的 service containers。POSTGRES_DB 是 admin DB（agentic_rag）：
# tests/integration/conftest.py 自己連它 CREATE DATABASE agentic_rag_test 並 ORM create_all，
# 所以管線不灌 infra/schema.sql（灌了反而跟 create_all 衝突）。
resources:
  containers:
    - container: postgres
      image: postgres:16-alpine
      env:
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: agentic_rag
      ports:
        - 5432:5432
      options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    - container: redis
      image: redis:7-alpine
      ports:
        - 6379:6379

stages:
  # ---------------------------------------------------------------------------
  # Stage 1：CI — 後端與前端平行跑 lint + test，任何一個紅就不進 Package
  # ---------------------------------------------------------------------------
  - stage: CI
    displayName: CI（lint + test）
    condition: eq('${{ parameters.mode }}', 'deploy')  # rollback 不重建、不重測
    jobs:
      - job: backend
        displayName: 後端 ruff / mypy / pytest / OpenAPI 破壞性變更
        steps:
          - checkout: self
            fetchDepth: 0  # oasdiff 需要比較基準（PR 目標分支或前一個 commit）

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 安裝 uv

          - script: |
              set -euo pipefail
              cd apps/backend
              uv sync --frozen
            displayName: uv sync（鎖定版本）

          - script: |
              set -euo pipefail
              cd apps/backend
              uv run ruff check src/ tests/
            displayName: lint（ruff）

          - script: |
              set -euo pipefail
              cd apps/backend
              uv run mypy src/
            displayName: 型別檢查（mypy）

          - script: |
              set -euo pipefail
              cd apps/backend
              uv run python -m pytest tests/unit/ \
                --junitxml=$(Build.ArtifactStagingDirectory)/backend-unit.xml \
                --cov=src --cov-report=xml:$(Build.ArtifactStagingDirectory)/coverage.xml \
                --cov-report=term-missing --cov-fail-under=${{ parameters.coverageFailUnder }} \
                -q --tb=short
            displayName: 單元測試（覆蓋率門檻 ${{ parameters.coverageFailUnder }}%）

          # 安全關鍵模組個別下限（Issue #101）：認證、租戶隔離、防護、額度不能被其他模組
          # 的高覆蓋率平均掉。全域門檻失敗時也照跑，兩份報告一起看。
          - script: |
              set -euo pipefail
              cd apps/backend
              uv run python scripts/check_coverage_floors.py \
                $(Build.ArtifactStagingDirectory)/coverage.xml
            displayName: 安全模組覆蓋率下限
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/backend-unit.xml
              testRunTitle: backend-unit

          # 契約閘門（docs/api-contract-review-2026-09-16.md §4 第 5 步）：
          # docs/api/openapi.json 由程式產出並提交（單元測試已守「與程式一致」），
          # 這一步再用 oasdiff 對比較基準做破壞性變更檢查——移除欄位、改型別、
          # 改可空性、新增必填請求欄位都會紅。需要繞過時另開版本路徑，不放寬這裡。
          - script: |
              set -euo pipefail
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                TARGET="$(System.PullRequest.TargetBranchName)"
                git fetch --quiet origin "$TARGET"
                BASE="origin/$TARGET"
              else
                BASE="HEAD~1"
              fi
              if git show "$BASE:docs/api/openapi.json" > "$(Agent.TempDirectory)/openapi-base.json" 2>/dev/null; then
                docker run --rm \
                  -v "$(Build.SourcesDirectory)/docs/api/openapi.json:/head.json:ro" \
                  -v "$(Agent.TempDirectory)/openapi-base.json:/base.json:ro" \
                  tufin/oasdiff:latest breaking /base.json /head.json --fail-on ERR
              else
                echo "比較基準 $BASE 沒有 docs/api/openapi.json，跳過"
              fi
            displayName: OpenAPI 破壞性變更檢查（oasdiff breaking）

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Build.ArtifactStagingDirectory)/coverage.xml

      - job: backend_integration
        displayName: 後端整合測試（真實 Postgres / Redis）
        # Issue #65：本機 45 個整合測試因 fixture / 環境不一致失敗，CI 首次接管線先不擋
        # Package；結果照樣發布到 Tests 分頁。#65 修完拿掉這行讓它回到硬閘門。
        continueOnError: true
        services:
          postgres: postgres
          redis: redis
        variables:
          DATABASE_URL_OVERRIDE: postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_rag_test
          REDIS_URL_OVERRIDE: redis://localhost:6379/0
          APP_ENV: development
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 安裝 uv

          - script: |
              set -euo pipefail
              cd apps/backend
              uv sync --frozen
            displayName: uv sync（鎖定版本）

          - script: |
              set -euo pipefail
              cd apps/backend
              uv run python -m pytest tests/integration/ -p no:asyncio \
                --junitxml=$(Build.ArtifactStagingDirectory)/backend-integration.xml \
                -q --tb=short
            displayName: 整合測試

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/backend-integration.xml
              testRunTitle: backend-integration

      - job: frontend
        displayName: 前端 eslint / tsc / vitest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              set -euo pipefail
              cd apps/frontend
              npm ci
              npm run lint
              npx tsc --noEmit
              npx vitest run --passWithNoTests --reporter=junit \
                --outputFile=$(Build.ArtifactStagingDirectory)/frontend-unit.xml
            displayName: lint + 單元測試

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/frontend-unit.xml
              testRunTitle: frontend-unit

  # ---------------------------------------------------------------------------
  # Stage 2：Package — 建映像推 Artifact Registry（只有 main，PR 不建）
  # ---------------------------------------------------------------------------
  - stage: Package
    displayName: 建置映像
    dependsOn: CI
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq('${{ parameters.mode }}', 'deploy')
      )
    jobs:
      - job: image
        displayName: widget build → docker build → push
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              set -euo pipefail
              cd apps/widget
              npm ci
              npm run build
            displayName: 建置 widget（打包進後端映像）

          # 後台 SPA 同源掛載（PR #56）：build:embed 輸出到 apps/backend/static/admin，
          # Dockerfile COPY . . 帶進映像。漏掉這步的映像後台會 404（09-02 rev 00006/00007 教訓）。
          - script: |
              set -euo pipefail
              cd apps/frontend
              npm ci
              npm run build:embed
            displayName: 建置後台 SPA（embed 進 static/admin）

          - template: infra/azure-pipelines/steps-gcp-auth.yml
            parameters:
              method: ${{ parameters.gcpAuthMethod }}

          - script: |
              set -euo pipefail
              gcloud auth configure-docker $(GCP_REGION)-docker.pkg.dev --quiet
              IMAGE="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName)"
              cd apps/backend
              docker build --platform linux/amd64 -t "$IMAGE:$(imageTag)" -t "$IMAGE:latest" .
              docker push "$IMAGE:$(imageTag)"
              docker push "$IMAGE:latest"
              echo "已推送 $IMAGE:$(imageTag)"
            displayName: 建置並推送映像

  # ---------------------------------------------------------------------------
  # Stage 3：Release — 全自動，無人工閘門
  #   mode=deploy（預設）：main 上的 push 一路跑到底：CI → Package → 部署 Cloud Run →
  #     同步並重啟 VM worker。部署本次 commit 的映像 rc-<sha>。
  #   mode=rollback：CI / Package 跳過，直接把 rollbackImageTag 指到的既有映像部署回去
  #     （預設 poc-previous = 上一次 deploy 前的線上版本），VM 也同步回該 commit。
  #   兩種模式都只允許 main：infra 的 WIF provider 只放行 refs/heads/main。
  #   Environment `poc` 只用來留部署歷史與稽核紀錄，**不要**在上面加 approvals，
  #   一加就變成要人按核准（要臨時擋住上線時才加）。
  # ---------------------------------------------------------------------------
  - stage: Release
    displayName: 自動部署到 POC
    dependsOn: Package
    # Package 在 rollback 模式被跳過，所以不能用預設的 succeeded()
    condition: >-
      and(
        not(canceled()),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        or(
          succeeded('Package'),
          eq('${{ parameters.mode }}', 'rollback')
        )
      )
    jobs:
      - deployment: cloudrun
        displayName: 部署 Cloud Run（${{ parameters.mode }}）
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                # rollback 需要完整歷史，檢查目標 commit 是否支援金鑰輪替（防呆步驟）
                - ${{ if eq(parameters.mode, 'rollback') }}:
                  - checkout: self
                    fetchDepth: 0
                - ${{ else }}:
                  - checkout: none

                - template: infra/azure-pipelines/steps-gcp-auth.yml
                  parameters:
                    method: ${{ parameters.gcpAuthMethod }}

                # 解析本次要上線的映像 tag 與 commit。後面 Cloud Run、health、VM 同步
                # 一律只用這兩個值，不再直接讀 Build.SourceVersion（rollback 時兩者不同）。
                # rollbackImageTag 是自由文字：經環境變數傳入並以白名單驗證，不用 ${{ }} 直接
                # 展開進 shell，避免指令注入。
                - script: |
                    set -euo pipefail
                    IMAGE_REPO="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName)"

                    list_recent() {
                      echo "最近的 rc-* 映像："
                      gcloud artifacts docker images list "$IMAGE_REPO" --include-tags \
                        --sort-by=~UPDATE_TIME --limit=10 --format='value(tags)' \
                        | tr ',' '\n' | grep '^rc-' || true
                    }

                    digest_of() {  # $1 = tag；映像不存在回空字串
                      gcloud artifacts docker images describe "$IMAGE_REPO:$1" \
                        --format='value(image_summary.digest)' 2>/dev/null || true
                    }

                    if [ "$MODE" = "deploy" ]; then
                      TAG="rc-$(Build.SourceVersion)"
                      SHA="$(Build.SourceVersion)"
                    else
                      if ! [[ "$REQ_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
                        echo "##vso[task.logissue type=error]rollbackImageTag 格式不合法：只允許英數與 . _ -"
                        exit 1
                      fi
                      DIGEST="$(digest_of "$REQ_TAG")"
                      if [ -z "$DIGEST" ]; then
                        echo "##vso[task.logissue type=error]找不到映像 $IMAGE_REPO:$REQ_TAG"
                        list_recent
                        exit 1
                      fi
                      if [[ "$REQ_TAG" == rc-* ]]; then
                        TAG="$REQ_TAG"
                      else
                        # 別名（poc-previous 等）→ 以 digest 反查同一個映像上的 rc-<sha> tag
                        TAG="$(gcloud artifacts docker tags list "$IMAGE_REPO" \
                          --format='value(tag,version)' \
                          | awk -v d="$DIGEST" '$2 ~ d && $1 ~ /\/tags\/rc-/ {print $1}' \
                          | sed 's#.*/tags/##' | head -1)"
                        if [ -z "$TAG" ]; then
                          echo "##vso[task.logissue type=error]$REQ_TAG（$DIGEST）沒有對應的 rc-<sha> tag，無法確定 commit"
                          list_recent
                          exit 1
                        fi
                      fi
                      SHA="${TAG#rc-}"
                    fi

                    if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "##vso[task.logissue type=error]$TAG 不是 rc-<40 碼 commit sha>"
                      exit 1
                    fi
                    echo "模式：$MODE"
                    echo "目標映像：$IMAGE_REPO:$TAG"
                    echo "目標 commit：$SHA"
                    echo "##vso[task.setvariable variable=TARGET_TAG;isOutput=true]$TAG"
                    echo "##vso[task.setvariable variable=TARGET_SHA;isOutput=true]$SHA"
                  name: resolve
                  displayName: 解析目標版本（TARGET_TAG / TARGET_SHA）
                  env:
                    MODE: ${{ parameters.mode }}
                    REQ_TAG: ${{ parameters.rollbackImageTag }}

                # 回滾防呆（Issue #106）：金鑰一旦輪替（active 不是 v1，或有 previous 金鑰），
                # DB 就可能有 `v2:` 前綴密文，#105 之前的程式讀不懂——回滾過去會讓供應商
                # API key、widget 身分、通知通道、MCP env 全部解不開。以目標 commit 的程式碼
                # 特徵判斷是否支援輪替（不看 commit 先後，cherry-pick 也判斷得對）。
                - ${{ if eq(parameters.mode, 'rollback') }}:
                  - script: |
                      set -euo pipefail
                      SHA="$(resolve.TARGET_SHA)"
                      STATE="$(gcloud run services describe $(serviceName) \
                        --region=$(GCP_REGION) --project=$(GCP_PROJECT_ID) --format=json \
                        | python3 -c '
                      import json, sys
                      env = json.load(sys.stdin)["spec"]["template"]["spec"]["containers"][0].get("env", [])
                      by = {e["name"]: e for e in env}
                      kid = by.get("ENCRYPTION_MASTER_KEY_ID", {})
                      key_id = kid.get("value", "secret" if "valueFrom" in kid else "v1") or "v1"
                      prev = by.get("ENCRYPTION_PREVIOUS_KEYS")
                      has_prev = bool(prev) and (bool(prev.get("value")) or "valueFrom" in prev)
                      print(key_id, "yes" if has_prev else "no")
                      ')"
                      read -r KEY_ID HAS_PREV <<< "$STATE"
                      echo "線上 ENCRYPTION_MASTER_KEY_ID=$KEY_ID，ENCRYPTION_PREVIOUS_KEYS 存在：$HAS_PREV"
                      if [ "$KEY_ID" = "v1" ] && [ "$HAS_PREV" = "no" ]; then
                        echo "尚未輪替金鑰，回滾不受限制"
                        exit 0
                      fi
                      if ! git cat-file -e "$SHA^{commit}"; then
                        echo "##vso[task.logissue type=error]repo 裡找不到目標 commit $SHA，無法確認是否支援金鑰輪替"
                        exit 1
                      fi
                      CRYPTO=apps/backend/src/infrastructure/crypto/aes_encryption_service.py
                      if git show "$SHA:$CRYPTO" 2>/dev/null | grep -q 'def split_ciphertext'; then
                        echo "目標 commit 支援金鑰輪替，可以回滾"
                        exit 0
                      fi
                      echo "##vso[task.logissue type=error]金鑰已輪替（active=$KEY_ID，previous=$HAS_PREV），但目標版本 $(resolve.TARGET_TAG) 不支援金鑰輪替（#105 之前），回滾後加密資料會解不開。請改選 #105 之後的 rc-<sha>，或先依 docs/encryption-key-rotation-runbook.md 把 active 切回 v1、跑完 reencrypt、清空 ENCRYPTION_PREVIOUS_KEYS。"
                      exit 1
                    displayName: 回滾防呆：目標版本須支援已輪替的加密金鑰

                # 記下部署前的線上版本。deploy 模式把它標成 poc-previous（下一次 rollback 的
                # 預設目標）；rollback 模式不動 poc-previous，免得連續回滾兩次變成來回互換。
                # 線上已經是目標版本（同版重新部署）時也不重標，否則 poc-previous 會指向同一版。
                - script: |
                    set -euo pipefail
                    IMAGE_REPO="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName)"
                    CUR="$(gcloud run services describe $(serviceName) \
                      --region=$(GCP_REGION) --project=$(GCP_PROJECT_ID) \
                      --format='value(spec.template.spec.containers[0].image)')"
                    echo "部署前線上映像：$CUR"
                    PREV_TAG="${CUR##*:}"
                    case "$CUR" in
                      "$IMAGE_REPO":*|"$IMAGE_REPO"@*) IN_REPO=1 ;;
                      *) IN_REPO=0 ;;
                    esac
                    if [ "$IN_REPO" = 1 ] && [ "$MODE" = "deploy" ]; then
                      CUR_DIGEST="$(gcloud artifacts docker images describe "$CUR" \
                        --format='value(image_summary.digest)')"
                      TARGET_DIGEST="$(gcloud artifacts docker images describe \
                        "$IMAGE_REPO:$(resolve.TARGET_TAG)" \
                        --format='value(image_summary.digest)')"
                      if [ "$CUR_DIGEST" = "$TARGET_DIGEST" ]; then
                        echo "線上已是目標版本（同版重新部署），poc-previous 維持不變"
                      else
                        gcloud artifacts docker tags add "$CUR" "$IMAGE_REPO:poc-previous" --quiet
                        echo "已將部署前的線上映像標為 poc-previous"
                      fi
                    elif [ "$IN_REPO" = 0 ]; then
                      echo "##vso[task.logissue type=warning]部署前映像不在 $IMAGE_REPO，無法標 poc-previous"
                    fi
                    echo "##vso[task.setvariable variable=PREV_IMAGE;isOutput=true]$CUR"
                    echo "##vso[task.setvariable variable=PREV_TAG;isOutput=true]$PREV_TAG"
                  name: previous
                  displayName: 記錄部署前版本（deploy 模式標 poc-previous）
                  env:
                    MODE: ${{ parameters.mode }}

                # 只換映像，不准帶 --set-env-vars / --set-secrets，也不准 services replace（infra 4.1）。
                # 網路（Direct VPC egress poc-vpc/poc-subnet, all-traffic）、資源（1 CPU / 2Gi /
                # min 1 / max 5）、runtime SA、環境變數與 Secret Manager 掛載全部沿用服務現況：
                # gcloud run deploy 未指定的設定會保留。要改設定走 infra，不在管線裡。
                - script: |
                    set -euo pipefail
                    IMAGE="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName):$(resolve.TARGET_TAG)"
                    gcloud run deploy $(serviceName) \
                      --image="$IMAGE" \
                      --region=$(GCP_REGION) \
                      --project=$(GCP_PROJECT_ID) \
                      --platform=managed \
                      --quiet
                  displayName: gcloud run deploy（只換映像）

                - script: |
                    set -euo pipefail
                    EXPECTED="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName):$(resolve.TARGET_TAG)"
                    LIVE="$(gcloud run services describe $(serviceName) \
                      --region=$(GCP_REGION) --project=$(GCP_PROJECT_ID) \
                      --format='value(spec.template.spec.containers[0].image)')"
                    if [ "$LIVE" != "$EXPECTED" ]; then
                      echo "##vso[task.logissue type=error]線上映像 $LIVE 不是本次目標 $EXPECTED"
                      exit 1
                    fi
                    URL=$(gcloud run services describe $(serviceName) \
                      --region=$(GCP_REGION) --project=$(GCP_PROJECT_ID) \
                      --format='value(status.url)')
                    echo "服務網址：$URL"
                    for i in $(seq 1 20); do
                      CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$URL/health" || echo 000)
                      echo "health 第 $i 次：$CODE"
                      [ "$CODE" = "200" ] && exit 0
                      sleep 5
                    done
                    echo "##vso[task.logissue type=error]health 檢查未通過"
                    exit 1
                  displayName: 確認線上映像並健康檢查（失敗即整條 Release 紅燈）

                - script: |
                    set -euo pipefail
                    IMAGE_REPO="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName)"
                    gcloud artifacts docker tags add \
                      "$IMAGE_REPO:$(resolve.TARGET_TAG)" "$IMAGE_REPO:poc-current" --quiet
                    echo "poc-current → $(resolve.TARGET_TAG)"
                  displayName: 標記 poc-current

      - deployment: worker
        displayName: 同步並重啟 VM 上的 arq worker
        dependsOn: cloudrun
        environment: ${{ parameters.environment }}
        variables:
          TARGET_TAG: $[ dependencies.cloudrun.outputs['cloudrun.resolve.TARGET_TAG'] ]
          TARGET_SHA: $[ dependencies.cloudrun.outputs['cloudrun.resolve.TARGET_SHA'] ]
          PREV_TAG: $[ dependencies.cloudrun.outputs['cloudrun.previous.PREV_TAG'] ]
        strategy:
          runOnce:
            deploy:
              steps:
                # 需要完整歷史才能做 bundle（rollback 時要打包舊 commit）
                - checkout: self
                  fetchDepth: 0

                - template: infra/azure-pipelines/steps-gcp-auth.yml
                  parameters:
                    method: ${{ parameters.gcpAuthMethod }}

                # worker 是 long-lived process（無 HTTP），跑在 GCE VM 上由 systemd 管理，
                # 與 Cloud Run 是兩條部署路徑。漏掉它的後果：worker 永遠跑舊 code，
                # 「Cloud Run 有新功能但背景作業跑不到」，而且完全沒有錯誤訊息。
                #
                # 程式碼傳遞用 git bundle + scp，不叫 VM 自己 git pull：
                #   1) VM 的 origin 指向 GitHub，改由 Azure 觸發後 pull 會拿到落後的 code；
                #   2) 讓 VM 有能力拉 Azure repo 就得在 VM 上放一份長期 PAT；
                #   3) bundle 綁的是本次目標 commit，跟 Cloud Run 跑的映像保證同一份原始碼。
                - script: |
                    set -euo pipefail
                    SHA="$(TARGET_SHA)"
                    if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "##vso[task.logissue type=error]沒有拿到 cloudrun job 解析的 TARGET_SHA"
                      exit 1
                    fi
                    if ! git cat-file -e "$SHA^{commit}"; then
                      echo "##vso[task.logissue type=error]repo 裡找不到 commit $SHA，無法同步 VM"
                      exit 1
                    fi
                    git bundle create /tmp/deploy.bundle "$SHA"
                    gcloud compute scp /tmp/deploy.bundle \
                      $(WORKER_VM_NAME):/tmp/deploy.bundle \
                      --zone=$(WORKER_VM_ZONE) --tunnel-through-iap \
                      --project=$(GCP_PROJECT_ID) --quiet
                  displayName: 打包目標 commit 並傳到 VM

                - script: |
                    set -euo pipefail
                    SHA="$(TARGET_SHA)"
                    gcloud compute ssh $(WORKER_VM_NAME) \
                      --zone=$(WORKER_VM_ZONE) --tunnel-through-iap \
                      --project=$(GCP_PROJECT_ID) --quiet \
                      --command="
                        set -euo pipefail
                        sudo chmod 0644 /tmp/deploy.bundle
                        sudo -u $(WORKER_VM_USER) bash -lc '
                          cd $(WORKER_REPO_PATH)
                          git fetch --quiet /tmp/deploy.bundle $SHA
                          git reset --hard $SHA
                          echo HEAD: \$(git rev-parse --short HEAD)
                          cd apps/backend
                          \$HOME/.local/bin/uv sync --quiet
                        '
                        rm -f /tmp/deploy.bundle
                        sudo systemctl restart arq-worker.service
                        sleep 3
                        sudo systemctl is-active arq-worker.service
                      "
                  displayName: 還原 commit + uv sync + 重啟 arq-worker

                - script: |
                    set -euo pipefail
                    SHA="$(TARGET_SHA)"
                    OUT=$(gcloud compute ssh $(WORKER_VM_NAME) \
                      --zone=$(WORKER_VM_ZONE) --tunnel-through-iap \
                      --project=$(GCP_PROJECT_ID) --quiet \
                      --command="sudo -u $(WORKER_VM_USER) bash -lc 'cd $(WORKER_REPO_PATH) && git rev-parse HEAD'")
                    echo "VM HEAD: $OUT"
                    echo "目標 commit: $SHA"
                    case "$OUT" in
                      *"$SHA"*) echo "==> worker 已在目標 commit" ;;
                      *) echo "##vso[task.logissue type=error]worker 未落在目標 commit"; exit 1 ;;
                    esac
                  displayName: 驗證 worker 已更新到目標 commit

                # 部署摘要（Run 頁面的 Summary 分頁）：下次要回滾時從這裡抄 tag。
                - script: |
                    set -euo pipefail
                    F="$(Agent.TempDirectory)/deploy-summary.md"
                    {
                      echo "## 部署結果（$MODE）"
                      echo
                      echo "| 項目 | 值 |"
                      echo "|---|---|"
                      echo "| 本次映像 tag | \`$(TARGET_TAG)\` |"
                      echo "| 本次 commit | \`$(TARGET_SHA)\` |"
                      echo "| 部署前線上 tag | \`$(PREV_TAG)\` |"
                      echo
                      echo "回滾：Pipelines → 3888 → Run pipeline（branch main），mode 選 \`rollback\`，"
                      echo "rollbackImageTag 填 \`$(PREV_TAG)\`（deploy 後也可留預設 \`poc-previous\`）。"
                      echo "DB schema 不會隨回滾還原；破壞性 migration 之前的版本不可回滾。"
                    } > "$F"
                    echo "##vso[task.uploadsummary]$F"
                  displayName: 寫入部署摘要
                  env:
                    MODE: ${{ parameters.mode }}
