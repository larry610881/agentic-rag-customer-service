# =============================================================================
# Agentic RAG Customer Service — Azure DevOps 多階段管線
#
#   CI（每個 PR / push）→ Package（只有 main）→ Release（自動部署，無人工閘門）
#
# 前置設定見 docs/azure-devops-setup.md：
#   - GCP 認證預設走 Workload Identity Federation（無長期金鑰）；要退回服務帳號
#     金鑰時，手動觸發時把參數 gcpAuthMethod 改成 sa-key，或改下面的 default
#   - 變數群組 `agentic-rag-gcp`（GCP_PROJECT_ID / GCP_PROJECT_NUMBER / GCP_REGION /
#     GCP_WIF_* / GCP_DEPLOY_SA / WORKER_* 等非祕密）
#   - 變數群組 `agentic-rag-runtime`（Cloud Run 執行期祕密，全部標記為 secret）
#   - Environment `poc`（只留部署歷史；**不要加 approvals**，加了就變成要人核准）
# =============================================================================

parameters:
  - name: gcpAuthMethod
    displayName: GCP 認證方式
    type: string
    default: wif
    values:
      - wif      # Workload Identity Federation（無長期金鑰）
      - sa-key   # 服務帳號 JSON 金鑰（備援）

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - "**/*.md"

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - "**/*.md"

variables:
  - group: agentic-rag-gcp        # GCP_PROJECT_ID / GCP_REGION / WORKER_VM_*
  - group: agentic-rag-runtime    # Cloud Run 執行期環境變數（全部 secret）
  - name: pythonVersion
    value: "3.12"
  - name: nodeVersion
    value: "20.x"
  - name: serviceName
    value: agentic-rag
  - name: arRepo
    value: poc-ar-rag
  - name: imageTag
    value: "rc-$(Build.SourceVersion)"

pool:
  vmImage: ubuntu-latest

stages:
  # ---------------------------------------------------------------------------
  # Stage 1：CI — 後端與前端平行跑 lint + test，任何一個紅就不進 Package
  # ---------------------------------------------------------------------------
  - stage: CI
    displayName: CI（lint + test）
    jobs:
      - job: backend
        displayName: 後端 ruff / mypy / pytest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 安裝 uv

          - script: |
              set -euo pipefail
              cd apps/backend
              uv sync --frozen
            displayName: uv sync（鎖定版本）

          - script: |
              set -euo pipefail
              cd apps/backend
              uv run ruff check src/ tests/
              uv run mypy src/
            displayName: lint（ruff + mypy）

          - script: |
              set -euo pipefail
              cd apps/backend
              uv run python -m pytest tests/unit/ \
                --junitxml=$(Build.ArtifactStagingDirectory)/backend-unit.xml \
                --cov=src --cov-report=xml:$(Build.ArtifactStagingDirectory)/coverage.xml \
                --cov-report=term-missing --cov-fail-under=80 \
                -q --tb=short
            displayName: 單元測試（覆蓋率門檻 80%）

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/backend-unit.xml
              testRunTitle: backend-unit

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Build.ArtifactStagingDirectory)/coverage.xml

      - job: backend_integration
        displayName: 後端整合測試（真實 Postgres / Redis）
        services:
          postgres: postgres
          redis: redis
        variables:
          DATABASE_URL_OVERRIDE: postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_rag_test
          REDIS_URL_OVERRIDE: redis://localhost:6379/0
          APP_ENV: development
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 安裝 uv

          - script: |
              set -euo pipefail
              cd apps/backend
              uv sync --frozen
              # 無 Alembic：schema 由 infra/schema.sql 建立（migration 規範見 .claude/rules）
              PGPASSWORD=postgres psql -h localhost -U postgres -d agentic_rag_test \
                -v ON_ERROR_STOP=1 -f ../../infra/schema.sql
            displayName: 建立測試 schema

          - script: |
              set -euo pipefail
              cd apps/backend
              uv run python -m pytest tests/integration/ -p no:asyncio \
                --junitxml=$(Build.ArtifactStagingDirectory)/backend-integration.xml \
                -q --tb=short
            displayName: 整合測試

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/backend-integration.xml
              testRunTitle: backend-integration

      - job: frontend
        displayName: 前端 eslint / tsc / vitest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              set -euo pipefail
              cd apps/frontend
              npm ci
              npx eslint src/
              npx tsc --noEmit
              npx vitest run --passWithNoTests --reporter=junit \
                --outputFile=$(Build.ArtifactStagingDirectory)/frontend-unit.xml
            displayName: lint + 單元測試

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/frontend-unit.xml
              testRunTitle: frontend-unit

  # ---------------------------------------------------------------------------
  # Stage 2：Package — 建映像推 Artifact Registry（只有 main，PR 不建）
  # ---------------------------------------------------------------------------
  - stage: Package
    displayName: 建置映像
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: image
        displayName: widget build → docker build → push
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              set -euo pipefail
              cd apps/widget
              npm ci
              npm run build
            displayName: 建置 widget（打包進後端映像）

          - template: infra/azure-pipelines/steps-gcp-auth.yml
            parameters:
              method: ${{ parameters.gcpAuthMethod }}

          - script: |
              set -euo pipefail
              gcloud auth configure-docker $(GCP_REGION)-docker.pkg.dev --quiet
              IMAGE="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName)"
              cd apps/backend
              docker build --platform linux/amd64 -t "$IMAGE:$(imageTag)" -t "$IMAGE:latest" .
              docker push "$IMAGE:$(imageTag)"
              docker push "$IMAGE:latest"
              echo "已推送 $IMAGE:$(imageTag)"
            displayName: 建置並推送映像

  # ---------------------------------------------------------------------------
  # Stage 3：Release — 全自動，無人工閘門
  #   main 上的 push 一路跑到底：CI → Package → 部署 Cloud Run → 同步並重啟 VM worker。
  #   Environment `poc` 只用來留部署歷史與稽核紀錄，**不要**在上面加 approvals，
  #   一加就變成要人按核准（要臨時擋住上線時才加）。
  # ---------------------------------------------------------------------------
  - stage: Release
    displayName: 自動部署到 POC
    dependsOn: Package
    condition: succeeded()
    jobs:
      - deployment: cloudrun
        displayName: 部署 Cloud Run
        environment: poc
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - template: infra/azure-pipelines/steps-gcp-auth.yml
                  parameters:
                    method: ${{ parameters.gcpAuthMethod }}

                # 用 --update-env-vars 而非 --set-env-vars：後者會把服務上「這份清單以外」
                # 的環境變數全部清掉。線上實際存在但不在此清單的變數（例如
                # EMBEDDING_PROVIDER）會被靜默移除，症狀是嵌入模型突然走回預設供應商。
                # 要刪變數時用 --remove-env-vars 明確指名。
                - script: |
                    set -euo pipefail
                    IMAGE="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(arRepo)/$(serviceName):$(imageTag)"
                    gcloud run deploy $(serviceName) \
                      --image="$IMAGE" \
                      --region=$(GCP_REGION) \
                      --project=$(GCP_PROJECT_ID) \
                      --platform=managed \
                      --allow-unauthenticated \
                      --port=8000 --memory=2Gi --cpu=1 \
                      --cpu-boost --no-cpu-throttling \
                      --min-instances=1 --max-instances=5 \
                      --vpc-connector=db-connector \
                      --vpc-egress=private-ranges-only \
                      --update-env-vars="^@^APP_ENV=production@LOG_LEVEL=INFO@DATABASE_URL_OVERRIDE=$(DATABASE_URL_OVERRIDE)@REDIS_URL_OVERRIDE=$(REDIS_URL_OVERRIDE)@MILVUS_URI=$(MILVUS_URI)@JWT_SECRET_KEY=$(JWT_SECRET_KEY)@ENCRYPTION_MASTER_KEY=$(ENCRYPTION_MASTER_KEY)@STORAGE_BACKEND=$(STORAGE_BACKEND)@GCS_BUCKET_NAME=$(GCS_BUCKET_NAME)@EMBEDDING_PROVIDER=$(EMBEDDING_PROVIDER)@RATE_LIMIT_ENABLED=$(RATE_LIMIT_ENABLED)"
                  displayName: gcloud run deploy

                - script: |
                    set -euo pipefail
                    URL=$(gcloud run services describe $(serviceName) \
                      --region=$(GCP_REGION) --project=$(GCP_PROJECT_ID) \
                      --format='value(status.url)')
                    echo "服務網址：$URL"
                    for i in $(seq 1 20); do
                      CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$URL/health" || echo 000)
                      echo "health 第 $i 次：$CODE"
                      [ "$CODE" = "200" ] && exit 0
                      sleep 5
                    done
                    echo "##vso[task.logissue type=error]health 檢查未通過"
                    exit 1
                  displayName: 健康檢查（失敗即整條 Release 紅燈）

      - deployment: worker
        displayName: 同步並重啟 VM 上的 arq worker
        dependsOn: cloudrun
        environment: poc
        strategy:
          runOnce:
            deploy:
              steps:
                # 需要完整歷史才能做 bundle
                - checkout: self
                  fetchDepth: 0

                - template: infra/azure-pipelines/steps-gcp-auth.yml
                  parameters:
                    method: ${{ parameters.gcpAuthMethod }}

                # worker 是 long-lived process（無 HTTP），跑在 GCE VM 上由 systemd 管理，
                # 與 Cloud Run 是兩條部署路徑。漏掉它的後果：worker 永遠跑舊 code，
                # 「Cloud Run 有新功能但背景作業跑不到」，而且完全沒有錯誤訊息。
                #
                # 程式碼傳遞用 git bundle + scp，不叫 VM 自己 git pull：
                #   1) VM 的 origin 指向 GitHub，改由 Azure 觸發後 pull 會拿到落後的 code；
                #   2) 讓 VM 有能力拉 Azure repo 就得在 VM 上放一份長期 PAT；
                #   3) bundle 綁的是本次建置的 commit，跟 Cloud Run 跑的映像保證同一份原始碼。
                - script: |
                    set -euo pipefail
                    SHA="$(Build.SourceVersion)"
                    git bundle create /tmp/deploy.bundle "$SHA"
                    gcloud compute scp /tmp/deploy.bundle \
                      $(WORKER_VM_NAME):/tmp/deploy.bundle \
                      --zone=$(WORKER_VM_ZONE) --tunnel-through-iap \
                      --project=$(GCP_PROJECT_ID) --quiet
                  displayName: 打包 commit 並傳到 VM

                - script: |
                    set -euo pipefail
                    SHA="$(Build.SourceVersion)"
                    gcloud compute ssh $(WORKER_VM_NAME) \
                      --zone=$(WORKER_VM_ZONE) --tunnel-through-iap \
                      --project=$(GCP_PROJECT_ID) --quiet \
                      --command="
                        set -euo pipefail
                        sudo chmod 0644 /tmp/deploy.bundle
                        sudo -u $(WORKER_VM_USER) bash -lc '
                          cd $(WORKER_REPO_PATH)
                          git fetch --quiet /tmp/deploy.bundle $SHA
                          git reset --hard $SHA
                          echo HEAD: \$(git rev-parse --short HEAD)
                          cd apps/backend
                          \$HOME/.local/bin/uv sync --quiet
                        '
                        rm -f /tmp/deploy.bundle
                        sudo systemctl restart arq-worker.service
                        sleep 3
                        sudo systemctl is-active arq-worker.service
                      "
                  displayName: 還原 commit + uv sync + 重啟 arq-worker

                - script: |
                    set -euo pipefail
                    SHA="$(Build.SourceVersion)"
                    OUT=$(gcloud compute ssh $(WORKER_VM_NAME) \
                      --zone=$(WORKER_VM_ZONE) --tunnel-through-iap \
                      --project=$(GCP_PROJECT_ID) --quiet \
                      --command="sudo -u $(WORKER_VM_USER) bash -lc 'cd $(WORKER_REPO_PATH) && git rev-parse HEAD'")
                    echo "VM HEAD: $OUT"
                    echo "本次建置: $SHA"
                    case "$OUT" in
                      *"$SHA"*) echo "==> worker 已在本次建置的 commit" ;;
                      *) echo "##vso[task.logissue type=error]worker 未落在預期 commit"; exit 1 ;;
                    esac
                  displayName: 驗證 worker 已更新到本次 commit
